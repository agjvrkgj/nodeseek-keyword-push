name = "nodeseek-keyword-push"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# After: npx wrangler d1 create nodeseek-keyword-push
# replace database_id with the real UUID from that command.
[[d1_databases]]
binding = "DB"
database_name = "nodeseek-keyword-push"
database_id = "2887f6b1-f830-4406-b830-01e317d59f9e"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
RSS_URL = "https://rss.nodeseek.com/"
# Optional: comma-separated Telegram user IDs allowed to manage keywords.
# Leave empty to allow anyone who can message the bot (not recommended).
ALLOWED_USER_IDS = "5093323865"
# NodeSeek automatic check-in starts at this hour in UTC+8.
NODESEEK_CHECKIN_HOUR = "9"
# true = random reward; false = fixed reward.
NODESEEK_CHECKIN_RANDOM = "true"
